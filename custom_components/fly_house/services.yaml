poke:
  name: Poke the fly
  description: Inject a sensory jolt into the reservoir (weekend debugging / party trick).
  fields:
    strength:
      name: Strength
      description: How hard to poke (0.1–5.0).
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          mode: slider
