loom:
  target:
    entity:
      integration: fly_house
    device:
      integration: fly_house
  name: Loom
  description: >-
    Rush something at the fly. Drives the LPLC2 looming-detector population,
    which converges on the descending neurons that trigger escape. The fly also
    treats it as punishment, so it learns to dislike wherever it was standing.
  fields:
    strength:
      name: Strength
      description: How fast the thing is coming at it.
      default: 1.2
      selector:
        number:
          min: 0.2
          max: 3.0
          step: 0.1

feed:
  target:
    entity:
      integration: fly_house
    device:
      integration: fly_house
  name: Feed
  description: >-
    Give it sugar. Drives the PAM dopaminergic neurons, which is the teaching
    signal that makes a memory positive, and reduces hunger.
  fields:
    amount:
      name: Amount
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.1

reset_memory:
  target:
    entity:
      integration: fly_house
    device:
      integration: fly_house
  name: Reset memory
  description: >-
    Restore every KC->MBON synapse to its measured strength, wiping everything
    the fly has learned about your house. It does not change the connectome,
    only the plastic gains on top of it.
