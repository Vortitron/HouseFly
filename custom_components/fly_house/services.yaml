poke:
  name: Poke the fly
  description: Inject a sensory jolt into the reservoir (weekend debugging / party trick).
  fields:
    strength:
      name: Strength
      description: How hard to poke (0.1–5.0).
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          mode: slider

feed:
  name: Feed the fly
  description: Give the fly food (reduces hunger, affects foraging behavior).
  fields:
    amount:
      name: Amount
      description: How much to feed (0.1–1.0, default 0.3 reduces hunger by 30%).
      required: false
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          mode: slider
    food_type:
      name: Food type
      description: Type of food (cosmetic: sugar, yeast, fruit).
      required: false
      default: "sugar"
      selector:
        text:
