<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
	<defs>
		<style>
			@keyframes spark1 { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
			@keyframes spark2 { 0%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
			@keyframes spark3 { 0%, 100% { opacity: 0.1; } 60% { opacity: 0.9; } }
			@keyframes pulse { 0%, 100% { r: 1.5; opacity: 0.8; } 50% { r: 2.5; opacity: 1; } }
			.spark1 { animation: spark1 1.2s infinite; }
			.spark2 { animation: spark2 1.5s infinite 0.3s; }
			.spark3 { animation: spark3 1.8s infinite 0.6s; }
			.node { animation: pulse 2s infinite; }
		</style>
		<radialGradient id="glow">
			<stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
			<stop offset="100%" stop-color="#0088ff" stop-opacity="0"/>
		</radialGradient>
	</defs>
	
	<!-- Background "brain" blob outline -->
	<ellipse cx="100" cy="75" rx="85" ry="60" fill="#1a1a2e" stroke="#4a4a6e" stroke-width="1"/>
	
	<!-- Connectome network (simplified) -->
	<g opacity="0.4" stroke="#6666aa" stroke-width="0.5" fill="none">
		<path d="M 30,40 Q 60,30 90,35"/>
		<path d="M 90,35 Q 120,40 150,30"/>
		<path d="M 30,70 Q 60,65 90,70"/>
		<path d="M 90,70 Q 120,75 150,70"/>
		<path d="M 40,100 Q 70,95 100,100"/>
		<path d="M 100,100 Q 130,105 160,100"/>
		<path d="M 90,35 L 90,70"/>
		<path d="M 60,40 L 70,95"/>
		<path d="M 130,40 L 120,95"/>
	</g>
	
	<!-- Active nodes with glow -->
	<g class="spark1">
		<circle cx="30" cy="40" r="2" fill="url(#glow)"/>
		<circle class="node" cx="30" cy="40" r="1.5" fill="#00ffff"/>
	</g>
	<g class="spark2">
		<circle cx="90" cy="35" r="2.5" fill="url(#glow)"/>
		<circle class="node" cx="90" cy="35" r="2" fill="#00ffff"/>
	</g>
	<g class="spark3">
		<circle cx="150" cy="70" r="2" fill="url(#glow)"/>
		<circle class="node" cx="150" cy="70" r="1.5" fill="#00ffff"/>
	</g>
	<g class="spark1">
		<circle cx="100" cy="100" r="2" fill="url(#glow)"/>
		<circle class="node" cx="100" cy="100" r="1.5" fill="#00ffff"/>
	</g>
	<g class="spark2">
		<circle cx="60" cy="65" r="1.8" fill="url(#glow)"/>
		<circle class="node" cx="60" cy="65" r="1.3" fill="#00aaff"/>
	</g>
	<g class="spark3">
		<circle cx="130" cy="75" r="1.8" fill="url(#glow)"/>
		<circle class="node" cx="130" cy="75" r="1.3" fill="#00aaff"/>
	</g>
	
	<!-- More static nodes -->
	<circle cx="40" cy="100" r="1" fill="#6666aa" opacity="0.6"/>
	<circle cx="160" cy="100" r="1" fill="#6666aa" opacity="0.6"/>
	<circle cx="70" cy="95" r="1" fill="#6666aa" opacity="0.5"/>
	<circle cx="130" cy="95" r="1" fill="#6666aa" opacity="0.5"/>
	<circle cx="100" cy="50" r="1" fill="#6666aa" opacity="0.6"/>
</svg>
