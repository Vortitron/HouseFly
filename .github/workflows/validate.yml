name: Validate

# Proves the two things a user cares about before installing: that HACS will
# accept this repository, and that Home Assistant will accept the integration.
# Both are official upstream actions, so this is their verdict rather than ours.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream requirements drift; catch it on a schedule rather than when
    # someone is trying to install.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  brain:
    name: The brain still does what the README says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # PyYAML because the checks read services.yaml the way Home Assistant
      # does. It was missing for two releases, and this job was red while
      # the same suite passed locally, where it happened to be installed.
      - run: pip install numpy pyyaml
      # Every check behind every number in the README: cell counts against the
      # literature, the ring attractor's Mexican hat, PEN hemispheres shifting
      # oppositely, the bump forming and integrating turns, KC->MBON depression,
      # a transient escape with a real threshold, a crepuscular arousal rhythm,
      # the safety layer's quiet hours, and the visual front end's own suite --
      # which needs Node, because the eye runs where the frames are.
      - run: python3 tools/validate.py
