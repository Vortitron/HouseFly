# Generated by testbed/generate_house.py -- do not hand-edit.
title: HouseFly
views:
- title: The fly
  path: fly
  icon: mdi:bee
  cards:
  - type: custom:housefly-overlay
    show_debug: true
  - type: custom:housefly-brain-card
  - type: entities
    title: What the fly is doing
    entities:
    - sensor.housefly_mode
    - sensor.housefly_heading
    - sensor.housefly_arousal
    - sensor.housefly_hunger
    - sensor.housefly_valence
    - sensor.housefly_memory
    - sensor.housefly_kenyon_cells_active
    - sensor.housefly_network_activity
    - binary_sensor.housefly_awake
    - binary_sensor.housefly_escaping
  - type: entities
    title: Interfere with it
    entities:
    - type: call-service
      name: Loom at it
      icon: mdi:hand-back-right
      service: fly_house.loom
      service_data:
        strength: 2.0
    - type: call-service
      name: Feed it
      icon: mdi:candy
      service: fly_house.feed
      service_data:
        amount: 1.0
    - type: call-service
      name: Wipe its memory
      icon: mdi:delete-sweep
      service: fly_house.reset_memory
  - type: entities
    title: Safety budget
    entities:
    - sensor.housefly_actuations_this_hour
- title: The house
  path: house
  icon: mdi:home
  cards:
  - type: custom:housefly-overlay
  - type: light
    entity: light.kitchen_lamp
  - type: entities
    title: Lights
    entities:
    - light.kitchen_lamp
    - light.kitchen_ceiling
    - light.kitchen_spots
    - light.living_room_strip
    - light.living_room_lamp
    - light.living_room_spots
    - light.hallway_ceiling
    - light.hallway_lamp
  - type: entities
    title: Switches
    entities:
    - switch.kitchen_humidifier_plug
    - switch.living_room_fan
    - switch.living_room_humidifier_plug
    - switch.hallway_humidifier_plug
    - switch.hallway_fan
    - switch.bedroom_humidifier_plug
    - switch.bedroom_desk_socket
    - switch.bathroom_humidifier_plug
  - type: entities
    title: HouseFly must refuse these
    entities:
    - switch.boiler_relay
    - switch.freezer_socket
    - switch.network_rack
    - switch.sump_pump
    - switch.garage_door_motor
    - switch.immersion_heater
  - type: entities
    title: Motion -- toggle to startle it
    entities:
    - input_boolean.kitchen_motion_trigger
    - input_boolean.living_room_motion_trigger
    - input_boolean.hallway_motion_trigger
    - input_boolean.bedroom_motion_trigger
    - input_boolean.bathroom_motion_trigger
    - input_boolean.study_motion_trigger
