template:
  - trigger:
      - platform: time_pattern
        seconds: "/10"
    sensor:
      - name: "Kitchen Temperature"
        unique_id: fake_kitchen_temperature
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {% set now_value = states('sensor.kitchen_temperature') | float(21.7) %}
          {% set drift = range(-100, 101) | random / 100 * 0.4 %}
          {{ (now_value + drift + (21.7 - now_value) * 0.05) | round(2) }}
      - name: "Kitchen Humidity"
        unique_id: fake_kitchen_humidity
        device_class: humidity
        unit_of_measurement: "%"
