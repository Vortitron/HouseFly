# Generated by testbed/generate_demo_house.py -- do not hand-edit.
# Somebody walking round the house, so the floor plan has a person in
# it. Room at a time, hallway in between, on a nine-minute cycle.
input_boolean:
  simulate_people:
    name: Simulate people
    icon: mdi:account-group
template:
- trigger:
  - trigger: time_pattern
    seconds: /10
  binary_sensor:
  - name: Kitchen Occupied
    unique_id: demo_kitchen_occupied
    device_class: occupancy
    state: '{% if is_state(''input_boolean.simulate_people'', ''off'') %}false{% else %}{% set slot =
      ((as_timestamp(now()) % 540) / 90) | int %}{{ slot in [0] }}{% endif %}'
  - name: Living Room Occupied
    unique_id: demo_living_room_occupied
    device_class: occupancy
    state: '{% if is_state(''input_boolean.simulate_people'', ''off'') %}false{% else %}{% set slot =
      ((as_timestamp(now()) % 540) / 90) | int %}{{ slot in [2] }}{% endif %}'
  - name: Hallway Occupied
    unique_id: demo_hallway_occupied
    device_class: occupancy
    state: '{% if is_state(''input_boolean.simulate_people'', ''off'') %}false{% else %}{% set slot =
      ((as_timestamp(now()) % 540) / 90) | int %}{{ slot in [1, 3, 5] }}{% endif %}'
  - name: Bedroom Occupied
    unique_id: demo_bedroom_occupied
    device_class: occupancy
    state: '{% if is_state(''input_boolean.simulate_people'', ''off'') %}false{% else %}{% set slot =
      ((as_timestamp(now()) % 540) / 90) | int %}{{ slot in [4] }}{% endif %}'
