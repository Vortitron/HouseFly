# Generated by testbed/generate_demo_house.py -- do not hand-edit.
# A simulated mmWave radar with someone walking in front of it, so the
# demo does something while nobody is watching.
input_boolean:
  simulated_occupant:
    name: Simulated occupant
    icon: mdi:walk
template:
- trigger:
  - trigger: time_pattern
    seconds: /1
  sensor:
  - name: Radar Moving Distance
    unique_id: demo_radar_distance
    device_class: distance
    unit_of_measurement: cm
    state_class: measurement
    state: '{% set n = as_timestamp(now()) | int %}{% set slot = (n / 100) | int %}{% set h = (slot *
      1103515245 + 12345) % 2147483648 %}{% set t = n % 100 - (10 + (h // 7) % 50) %}{% if h % 6 == 0
      %}{% set t = -1 %}{% endif %}{% if is_state(''input_boolean.simulated_occupant'', ''off'') %}500{%
      elif t < 0 %}500{% elif t < 6 %}{{ (500 - t / 6 * 450) | round(0) }}{% elif t < 9 %}50{% elif t
      < 15 %}{{ (50 + (t - 9) / 6 * 450) | round(0) }}{% else %}500{% endif %}'
  - name: Radar Moving Energy
    unique_id: demo_radar_energy
    state_class: measurement
    state: '{% set n = as_timestamp(now()) | int %}{% set slot = (n / 100) | int %}{% set h = (slot *
      1103515245 + 12345) % 2147483648 %}{% set t = n % 100 - (10 + (h // 7) % 50) %}{% if h % 6 == 0
      %}{% set t = -1 %}{% endif %}{% if is_state(''input_boolean.simulated_occupant'', ''off'') %}0{%
      elif t < 0 or t > 15 %}0{% elif t < 9 %}{{ range(70, 101) | random }}{% else %}{{ range(40, 71)
      | random }}{% endif %}'
- binary_sensor:
  - name: Radar Presence
    unique_id: demo_radar_presence
    device_class: occupancy
    state: '{{ states(''sensor.radar_moving_distance'') | float(500) < 450 }}'
