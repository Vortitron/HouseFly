# Generated by testbed/generate_demo_house.py -- do not hand-edit.
# A simulated mmWave radar with someone walking in front of it, so the
# demo does something while nobody is watching.
input_boolean:
  simulated_occupant:
    name: Simulated occupant
    icon: mdi:walk
template:
- trigger:
  - trigger: time_pattern
    seconds: /5
  sensor:
  - name: Radar Moving Distance
    unique_id: demo_radar_distance
    device_class: distance
    unit_of_measurement: cm
    state_class: measurement
    state: '{% set p = (as_timestamp(now()) % 180) / 180 %}{% if is_state(''input_boolean.simulated_occupant'',
      ''off'') %}500{% elif p < 0.72 %}500{% elif p < 0.86 %}{{ (500 - (p - 0.72) / 0.14 * 450) | round(0)
      }}{% else %}{{ (50 + (p - 0.86) / 0.14 * 450) | round(0) }}{% endif %}'
  - name: Radar Moving Energy
    unique_id: demo_radar_energy
    state_class: measurement
    state: '{% set p = (as_timestamp(now()) % 180) / 180 %}{% if is_state(''input_boolean.simulated_occupant'',
      ''off'') %}0{% elif p < 0.72 %}0{% else %}{{ range(60, 101) | random }}{% endif %}'
- binary_sensor:
  - name: Radar Presence
    unique_id: demo_radar_presence
    device_class: occupancy
    state: '{{ states(''sensor.radar_moving_distance'') | float(500) < 450 }}'
