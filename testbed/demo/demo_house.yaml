# Generated by testbed/generate_demo_house.py -- do not hand-edit.
# A small fake house for the public demo. Nothing here touches hardware.
input_boolean:
  kitchen_light:
    name: Kitchen light helper
  kitchen_socket_helper:
    name: Kitchen socket helper
  kitchen_motion_trigger:
    name: Kitchen motion trigger
  living_room_light:
    name: Living Room light helper
  living_room_socket_helper:
    name: Living Room socket helper
  living_room_motion_trigger:
    name: Living Room motion trigger
  hallway_light:
    name: Hallway light helper
  hallway_socket_helper:
    name: Hallway socket helper
  hallway_motion_trigger:
    name: Hallway motion trigger
  bedroom_light:
    name: Bedroom light helper
  bedroom_socket_helper:
    name: Bedroom socket helper
  bedroom_motion_trigger:
    name: Bedroom motion trigger
  boiler_relay_helper:
    name: Boiler Relay helper
  freezer_socket_helper:
    name: Freezer Socket helper
  network_rack_helper:
    name: Network Rack helper
  garage_door_motor_helper:
    name: Garage Door Motor helper
input_number:
  kitchen_brightness:
    name: Kitchen brightness
    min: 0
    max: 100
    step: 1
    initial: 60
  living_room_brightness:
    name: Living Room brightness
    min: 0
    max: 100
    step: 1
    initial: 60
  hallway_brightness:
    name: Hallway brightness
    min: 0
    max: 100
    step: 1
    initial: 60
  bedroom_brightness:
    name: Bedroom brightness
    min: 0
    max: 100
    step: 1
    initial: 60
  approach_distance:
    name: How close you are
    min: 30
    max: 500
    step: 5
    initial: 500
    unit_of_measurement: cm
    icon: mdi:arrow-collapse-right
template:
- light:
  - name: Kitchen
    unique_id: demo_kitchen
    state: '{{ is_state(''input_boolean.kitchen_light'', ''on'') }}'
    level: '{{ (states(''input_number.kitchen_brightness'') | float(0) * 2.55) | round(0) }}'
    turn_on:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kitchen_light
    turn_off:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.kitchen_light
    set_level:
    - action: input_number.set_value
      target:
        entity_id: input_number.kitchen_brightness
      data:
        value: '{{ (brightness / 2.55) | round(0) }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kitchen_light
  - name: Living Room
    unique_id: demo_living_room
