- trigger:
  - trigger: time_pattern
    seconds: /10
  sensor:
  - name: Kitchen Temperature
    unique_id: demo_kitchen_temperature
    device_class: temperature
    unit_of_measurement: °C
    state_class: measurement
    state: '{% set v = states(''sensor.kitchen_temperature'') | float(21.0) %}{% set drift = range(-100,
      101) | random / 100 * 0.4 %}{{ (v + drift + (21.0 - v) * 0.05) | round(2) }}'
  - name: Living Room Temperature
    unique_id: demo_living_room_temperature
    device_class: temperature
    unit_of_measurement: °C
    state_class: measurement
    state: '{% set v = states(''sensor.living_room_temperature'') | float(20.0) %}{% set drift = range(-100,
      101) | random / 100 * 0.4 %}{{ (v + drift + (20.0 - v) * 0.05) | round(2) }}'
  - name: Hallway Temperature
    unique_id: demo_hallway_temperature
