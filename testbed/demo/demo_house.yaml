      101) | random / 100 * 0.4 %}{{ (v + drift + (19.0 - v) * 0.05) | round(2) }}'
  - name: Approach Distance
    unique_id: demo_approach
    device_class: distance
    unit_of_measurement: cm
    state_class: measurement
    state: '{{ states(''input_number.approach_distance'') | float(500) }}'
- binary_sensor:
  - name: Kitchen Motion
    unique_id: demo_kitchen_motion
    device_class: motion
    state: '{{ is_state(''input_boolean.kitchen_motion_trigger'', ''on'') }}'
  - name: Living Room Motion
