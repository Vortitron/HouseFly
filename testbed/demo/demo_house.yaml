    unit_of_measurement: °C
    state_class: measurement
    state: '{% set v = states(''sensor.hallway_temperature'') | float(18.0) %}{% set drift = range(-100,
      101) | random / 100 * 0.4 %}{{ (v + drift + (18.0 - v) * 0.05) | round(2) }}'
  - name: Bedroom Temperature
