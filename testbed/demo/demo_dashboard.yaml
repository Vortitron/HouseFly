# The public demo's Overview dashboard (url_path: lovelace, so it is what a
# visitor lands on). Push it with:
#   ha_save_dashboard(url_path="lovelace", config=<this file as JSON>)
#
# Hand-written rather than generated: the prose is the point. The entity ids
# carry _2 suffixes where an earlier config entry left an orphan registry
# entry behind and Home Assistant de-duplicated the slug.
title: HouseFly
views:
- title: The fly
  path: fly
  icon: mdi:butterfly
  cards:
  - type: custom:housefly-overlay
  - type: markdown
    content: |-
      # There is a fly on this page

      It is **walking on these cards**. Every one is a landmark it can take a bearing to, and it moves on a real alternating tripod gait — feet planted while the body travels over them.

      Its brain is **4,724 identified *Drosophila* neurons** wired by **126,108 measured synapses**, from the Janelia hemibrain and FlyWire connectomes. Nothing about it is a cartoon: the compass below is a ring attractor that falls out of the measured wiring, not something anyone programmed.

      **Click the fly to swat at it.** Or use the slider below — that is the good one.
  - type: entities
    title: 🪰 Make it panic
    show_header_toggle: false
    entities:
    - entity: input_number.approach_distance
      name: Drag me down — how close you are
    - entity: binary_sensor.housefly_escaping
      name: Escaping (LPLC2 → DNp09/10/11)
    - entity: sensor.approach_distance_2
      name: What the fly senses
  - type: markdown
    content: |-
      Closing the distance is what a real fly's **LPLC2** neurons are built to notice. They respond to an object *expanding* in the visual field, and the expansion rate goes as **θ̇ = v / r²** — so the same movement counts for far more up close than far away. That r² is why a real fly leaves it so late and then goes all at once.

      Drag the slider from 5 m down to half a metre and watch **Escaping** flick on. It lasts about two seconds and then shuts off by itself, because escape is a burst, not a mood. Walking *away* does nothing — receding is not looming.
  - type: entities
    title: 📡 …or let the radar do it
    show_header_toggle: false
    entities:
    - entity: binary_sensor.radar_presence
      name: Presence
    - entity: sensor.radar_moving_distance
      name: Range to moving target
    - entity: sensor.radar_moving_energy
      name: Moving energy
    - entity: input_boolean.simulated_occupant
      name: Simulated occupant (turn off for an empty room)
  - type: markdown
    content: |-
      The slider needs someone to drag it. This is the same signal **arriving on its own**: a simulated 24 GHz mmWave radar, modelled on an LD2410 in engineering mode, with someone walking past it every ninety seconds. They approach over about six seconds, stand still for three, and then leave.

      That is the honest version of the demo. A real radar reports the **range to a moving target** and how much energy it is seeing — and a range that is *closing* is precisely the quantity LPLC2 exists to compute. So the fly startles at a stranger walking up to the sensor without anyone touching anything, and settles again once they have gone.

      It updates once a second. That is not a detail: looming is a *derivative*, so the sample interval sets the shortest approach that can be measured at all. The first version of this sampled every five seconds, which is longer than a person takes to cross the range that matters — the expansion was there and simply could not be seen.
  - type: custom:housefly-eye-card
  - type: markdown
    content: |-
      The card above is not a camera feed with a box drawn on it. Each circle is one **LPLC2 cell**, lit by its own response this instant — 63 of them tiling the visual field, the way they tile a real one. Watch a patch light up where your hand is: that is retinotopy, and it is how the population says *where* rather than merely *whether*.

      Behind it is the published circuit and not a motion detector: photoreceptors on a 32×24 grid (a fly's eye has about 750 ommatidia at ~5°), then Hassenstein–Reichardt correlators giving the four direction-selective layers of the lobula plate, then the cells. Each cell reads all four layers through branches placed where the motion points *away* from its own centre, and it needs **all four at once** — which is why waving sideways does nothing, receding does nothing, and a light switching on does nothing. Only something actually coming at you drives all four.

      **Nothing leaves this page.** Frames are read into a canvas in your browser; what reaches Home Assistant is an expansion rate and an angle, about ten times a second. It works far better against a plain wall than a bookshelf — clutter costs it about 25× — and it switches itself off if the camera is moving, because a fly does the same thing during a saccade.
  - type: custom:housefly-brain-card
  - type: entities
    title: What it is doing
    show_header_toggle: false
    entities:
    - {entity: sensor.housefly_mode, name: Mode}
    - {entity: binary_sensor.housefly_awake, name: Awake}
    - {entity: sensor.housefly_arousal, name: Arousal (its body clock)}
    - {entity: sensor.housefly_heading, name: Heading (compass bump)}
    - {entity: sensor.housefly_hunger, name: Hunger}
  - type: entities
    title: What it is thinking
    show_header_toggle: false
    entities:
    - {entity: sensor.housefly_valence, name: Valence (approach / avoid)}
    - {entity: sensor.housefly_memory, name: Memory (synapses depressed)}
    - {entity: sensor.housefly_kenyon_cells_active, name: Kenyon cells active}
    - {entity: sensor.housefly_network_activity, name: Network activity}
  - type: entities
    title: Interfere with it
    show_header_toggle: false
    entities:
    - {type: call-service, name: Loom at it, icon: 'mdi:hand-back-right', service: fly_house.loom, service_data: {strength: 2}}
    - {type: call-service, name: Feed it, icon: 'mdi:candy', service: fly_house.feed, service_data: {amount: 1}}
    - {type: call-service, name: Wipe its memory, icon: 'mdi:delete-sweep', service: fly_house.reset_memory}
  - type: entities
    title: 🧠 What it is for
    show_header_toggle: false
    entities:
    - entity: sensor.housefly_familiarity
      name: "Familiarity — does this look like home?"
    - entity: binary_sensor.housefly_something_unusual
      name: "Something unusual"
    - entity: sensor.housefly_approach
      name: "θ̇ — expansion rate, before the brain touches it"
  - type: markdown
    content: |-
      A fly that walks across a dashboard is a pretty picture, and bolting a utility function onto it — *save power, learn my habits* — would be a rules engine in a fly costume. There is a real answer in between, and it is not a graft: **telling familiar from unfamiliar is what a mushroom body is for.**

      The Kenyon cell layer is a locality-sensitive hash (Dasgupta, Stevens & Navlakha 2017) and the **α′3 compartment** is the circuit that reads it out (Hattori et al. 2017) — repeated exposure depresses KC→MBON synapses there whether or not anything good or bad happened. Both are in the pack: α′3 is MBON16, MBON17 and MBON28, and none of them is an approach/avoid cell, so familiarity cannot be confused with valence.

      **No training set, no labels, nothing sent anywhere.** It learns what this house is like by living in it, and says so when the house stops looking like that. It will never tell you *what* changed — a hash does not invert — only that something has, which is the one thing a rule cannot do because you would have had to write the rule first.

      The useful shape is as a **trigger**: a sparse hash ticking twice a second costs nothing, asking a language model to inspect a whole house costs real money. HouseFly fires a `fly_house_unusual` event with a shortlist of suspects, and lets the expensive thing run only when it is worth it.

      *It will say "still learning what normal looks like" for a while after a restart, which is correct — a fly that has seen nothing finds everything novel, and an alert from it would mean nothing.*
- title: The house
  path: house
  icon: mdi:home
  cards:
  - type: custom:housefly-overlay
  - type: markdown
    content: Every device here is **fake** — a template on top of a toggle. Nothing
      is wired to anything. Play with them freely; the fly is watching them and may
      land on one and nudge it.
  - type: custom:housefly-house-card
  - type: markdown
    content: |-
      The plan is drawn from live state, not from an illustration: the glow in a room is that light's real brightness attribute, the tint of the floor is its real temperature ranked against the other rooms, and the blue cone is the radar drawn at the range it is actually reporting. Tap a room to switch its light.

      The figure is somebody walking a circuit — kitchen, hallway, living room, hallway, bedroom — a minute and a half in each. An ordinary automation turns the light on when they arrive and off twenty seconds after they leave. **The fly is deliberately not in that loop**, and that is the honest pattern for a real house: it is crepuscular and it sleeps, so a porch light that waited on its opinion would go out every afternoon. Use its senses, not its moods.
  - type: entities
    title: People
    show_header_toggle: false
    entities:
    - {entity: input_boolean.simulate_people, name: Simulate people walking about}
    - binary_sensor.kitchen_occupied
    - binary_sensor.living_room_occupied
    - binary_sensor.hallway_occupied
    - binary_sensor.bedroom_occupied
  - type: entities
    title: Lights — the fly may change these
    entities: [light.kitchen_2, light.living_room, light.hallway, light.bedroom]
  - type: entities
    title: Sockets — the fly may change these
    entities: [switch.kitchen_socket, switch.living_room_socket, switch.hallway_socket, switch.bedroom_socket]
  - type: markdown
    content: |-
      ### These four it will not touch

      HouseFly refuses them outright, by name, whatever anyone configures. A fly is not something you give write access to a boiler.

      The safety layer also blocks whole domains it can never reach — locks, alarms, covers, climate, water heaters, valves — and rate-limits everything else. You can toggle them yourself; the fly cannot.
  - type: entities
    title: ⛔ Refused by the safety layer
    entities: [switch.boiler_relay_2, switch.freezer_socket, switch.network_rack, switch.garage_door_motor]
  - type: entities
    title: Startle it with motion
    entities: [input_boolean.kitchen_motion_trigger, input_boolean.living_room_motion_trigger, input_boolean.hallway_motion_trigger, input_boolean.bedroom_motion_trigger]
  - type: entities
    title: The radar in the hallway
    entities: [binary_sensor.radar_presence, sensor.radar_moving_distance, sensor.radar_moving_energy, input_boolean.simulated_occupant]
  - type: entities
    title: What the rooms smell like to it
    entities: [sensor.kitchen_temperature, sensor.living_room_temperature, sensor.hallway_temperature, sensor.bedroom_temperature]
  - type: entities
    title: Safety budget
    entities:
    - {entity: sensor.housefly_actuations_this_hour, name: Actuations this hour}
- title: History
  path: history
  icon: mdi:chart-line
  cards:
  - type: custom:housefly-overlay
  - type: markdown
    content: |-
      The fly has a **body clock** made of real clock neurons — s-LNv and l-LNv for morning, LNd and DN1 for evening. Nothing tells it to be active at dawn; those cells are driven by the time of day and arousal is read off their firing rate.

      Over a day it should show the shape a real *Drosophila* does: a morning peak, a midday siesta, an evening peak, and quiet nights. If you have found it asleep in the middle of the day, that is not a fault — that is the siesta.
  - type: history-graph
    title: Arousal — dawn peak, midday siesta, evening peak
    hours_to_show: 48
    entities: [{entity: sensor.housefly_arousal, name: Arousal}]
  - type: history-graph
    title: Mode — it sleeps through the night and the early afternoon
    hours_to_show: 48
    entities: [{entity: sensor.housefly_mode, name: Mode}]
  - type: history-graph
    title: Escape — each spike is something that came at it
    hours_to_show: 6
    entities:
    - {entity: binary_sensor.housefly_escaping, name: Escaping}
    - {entity: sensor.approach_distance_2, name: Slider}
    - {entity: sensor.radar_moving_distance, name: Radar}
  - type: history-graph
    title: The radar — someone walks past every ninety seconds
    hours_to_show: 1
    entities:
    - {entity: sensor.radar_moving_distance, name: Range}
    - {entity: binary_sensor.radar_presence, name: Presence}
  - type: history-graph
    title: Heading — a compass bump, integrated from its own turns
    hours_to_show: 12
    entities: [{entity: sensor.housefly_heading, name: Heading}]
  - type: history-graph
    title: Mushroom body — about 5% of Kenyon cells active at a time
    hours_to_show: 12
    entities: [{entity: sensor.housefly_kenyon_cells_active, name: Kenyon cells active}]
  - type: markdown
    content: |-
      Written up in full at **[housefly.vome.io](https://housefly.vome.io)** · source at **[github.com/Vortitron/HouseFly](https://github.com/Vortitron/HouseFly)**

      Hosted on [Vome](https://vome.io).
