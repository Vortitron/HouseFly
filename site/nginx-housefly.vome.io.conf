# HouseFly project page. Static only -- no backend, no state.
server {
    server_name housefly.vome.io;

    root /var/www/housefly;
    index index.html;

    # Certbot needs this served over plain HTTP to issue and renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /demo -> the hosted demo's guest sign-in.
    #
    # The token lives here rather than in the page so that rotating it is one
    # line in one file instead of an edit-and-redeploy, and so the public HTML
    # does not carry a credential in its source. It is not a secret in any
    # meaningful sense -- anyone who follows it is signed in as the non-admin
    # Guest user, which is the entire point of a public demo -- but it does
    # expire, and when it does this is the line to change.
    #
    # Lands on lovelace/fly, so a visitor arrives on the fly itself rather
    # than on whichever view Home Assistant would have picked.
    # Reissue with vomehome_create_guest_link (dashboard: lovelace/fly).
    location = /demo {
        return 302 "https://748d339f-ae52-4cc3-81d7-f7c93f1a8852.home.vome.io/local/vome_login.html#rt=612dc83b918d4bedaf3fec8a9ef018ff8663b769ed35e9690c6768214fc8f84073e761f51af5568eab8934d77b335ce831b0950ad03f1e841b1516b5009c517f&cid=https%3A%2F%2F748d339f-ae52-4cc3-81d7-f7c93f1a8852.home.vome.io%2F&go=lovelace%2Ffly";
    }

    # /swarm -> the three-fly instance's guest sign-in.
    #
    # Same arrangement as /demo above and for the same reasons: the token is
    # here rather than in the page, so rotating it is one line, and the public
    # HTML carries no credential.
    #
    # A separate instance from the demo, because the demo is one fly in one
    # house and this is four animals sharing one -- different names, clocks,
    # territories and memories, interacting only through the house itself.
    # Lands on the fly-swarm dashboard.
    # Issued 2026-09-22, expires 2026-10-22.
    # Reissue with vomehome_create_guest_link (dashboard: fly-swarm).
    location = /swarm {
        return 302 "https://b13509eb-dba0-45e0-8034-5ba03794639d.home.vome.io/local/vome_login.html#rt=b93b63afa4e858c171dd0d3c46301a530f8c7c287e1242194fe61cf6de9cbd4fbf685c3731f7b7ef980bf6dad959a4bfab375f01b233abdf55d6eb8f8f30babc&cid=https%3A%2F%2Fb13509eb-dba0-45e0-8034-5ba03794639d.home.vome.io%2F&go=fly-swarm";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/housefly.vome.io.access.log;
    error_log  /var/log/nginx/housefly.vome.io.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/housefly.vome.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/housefly.vome.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = housefly.vome.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name housefly.vome.io;
    return 404; # managed by Certbot


}