# HouseFly project page. Static only -- no backend, no state.
server {
    server_name housefly.vome.io;

    root /var/www/housefly;
    index index.html;

    # Certbot needs this served over plain HTTP to issue and renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /demo -> the hosted demo's guest sign-in.
    #
    # The token lives here rather than in the page so that rotating it is one
    # line in one file instead of an edit-and-redeploy, and so the public HTML
    # does not carry a credential in its source. It is not a secret in any
    # meaningful sense -- anyone who follows it is signed in as the non-admin
    # Guest user, which is the entire point of a public demo -- but it does
    # expire, and when it does this is the line to change.
    #
    # Lands on lovelace/fly, so a visitor arrives on the fly itself rather
    # than on whichever view Home Assistant would have picked.
    # Reissue with vomehome_create_guest_link (dashboard: lovelace/fly).
    location = /demo {
        return 302 "https://748d339f-ae52-4cc3-81d7-f7c93f1a8852.home.vome.io/local/vome_login.html#rt=91097c9e10e68836787c2284d13c37d9b2c6a5832837ce1af20c6d10c90004adf0ba8cfdaf1fd5754e0c91642e690a1e7c161a7f64b24ea610d224c896a658ed&cid=https%3A%2F%2F748d339f-ae52-4cc3-81d7-f7c93f1a8852.home.vome.io%2F&go=lovelace%2Ffly";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/housefly.vome.io.access.log;
    error_log  /var/log/nginx/housefly.vome.io.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/housefly.vome.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/housefly.vome.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = housefly.vome.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name housefly.vome.io;
    return 404; # managed by Certbot


}