# HouseFly project page. Static only -- no backend, no state.
server {
    server_name housefly.vome.io;

    root /var/www/housefly;
    index index.html;

    # Certbot needs this served over plain HTTP to issue and renew.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /demo, /swarm and /housewad -> one-click guest sign-ins on the hosted
    # demo homes (the fly, the four-fly swarm, and house.wad's clip view).
    #
    # The links are not in this file any more: a guest link lasts at most 30
    # days, so site/renew_guest_links.py (housefly-guest-links.timer, daily)
    # reissues each with a week to go and writes them to this include, which
    # is root-only and outside the repository. See that script to reissue by
    # hand: renew_guest_links.py --force.
    include /etc/nginx/housefly-guest-links.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/housefly.vome.io.access.log;
    error_log  /var/log/nginx/housefly.vome.io.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/housefly.vome.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/housefly.vome.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = housefly.vome.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name housefly.vome.io;
    return 404; # managed by Certbot


}